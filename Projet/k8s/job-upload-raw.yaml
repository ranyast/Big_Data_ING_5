# Depose le CSV brut dans la couche bronze du bucket Onyxia (equivalent k8s de src/00_upload_raw.sh).
# Adapte du lab 03 (objectstorage/job-upload-bronze.yaml). Le CSV (4,5 Mo) depasse la limite de 1 Mo
# d'un ConfigMap : un init container le recupere depuis le repo public du projet.
#
# Prerequis : ConfigMap `s3-config` (AWS_ENDPOINT_URL, AWS_DEFAULT_REGION, LAB_BUCKET_NAME) et
# Secret `s3-credentials` (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN), comme au lab 03.
# Usage : kubectl apply -f k8s/job-upload-raw.yaml && kubectl logs job/upload-running-raw -c upload
apiVersion: batch/v1
kind: Job
metadata:
  name: upload-running-raw
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: fetch
          image: alpine/git:latest
          env:
            # A adapter si le projet est deplace dans un autre repo (ex. bigdata_project : CSV_PATH=data/...)
            - name: REPO_URL
              value: https://github.com/ranyast/Big_Data_ING_5.git
            - name: CSV_PATH
              value: Projet/data/running_data_france_final.csv
          command: ["sh", "-c"]
          args:
            - |
              set -e
              git clone --depth 1 "$REPO_URL" /repo
              cp "/repo/$CSV_PATH" /data/running_data_france_final.csv
              ls -l /data
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: upload
          image: amazon/aws-cli:latest
          command: ["sh", "-c"]
          args:
            - |
              set -e
              aws s3 cp /data/running_data_france_final.csv \
                "s3://$LAB_BUCKET_NAME/bronze/running/running_data_france_final.csv"
              aws s3 ls "s3://$LAB_BUCKET_NAME/bronze/running/"
          envFrom:
            - configMapRef:
                name: s3-config
            - secretRef:
                name: s3-credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
